run_name: joint_mae_resnet18_cls75_mae25_mask75_seed0
seed: 0
output_root: results/checkpoint3
checkpoint_root: artifacts/checkpoints/checkpoint3
data:
  train_root: data/train
  train_manifest: splits/train.csv
  validation_manifest: splits/val.csv
  normalization_mean: [0.5, 0.5, 0.5]
  normalization_std: [0.25, 0.25, 0.25]
model:
  name: resnet18
  num_classes: 16
  image_size: 224
  initialization: random
objective:
  name: joint_mae_auxiliary
  classification_weight: 0.75
  reconstruction_weight: 0.25
  patch_size: 16
  mask_ratio: 0.75
  normalize_patch_targets: true
training:
  batch_size: 64
  num_workers: 8
  epochs: 100
  early_stopping_patience: 20
  learning_rate: 0.001
  minimum_learning_rate: 0.000001
  warmup_epochs: 5
  weight_decay: 0.0001
  label_smoothing: 0.1
  gradient_clip_norm: 1.0
  mixed_precision: true
