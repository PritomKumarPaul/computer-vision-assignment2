run_name: dino_vit_tiny_seed0
method: dino
backbone: vit_tiny
seed: 0
output_root: results/checkpoint2/pretraining
checkpoint_root: artifacts/checkpoints/checkpoint2/pretraining
image_size: 224
data:
  train_root: data/train
  train_manifest: splits/train.csv
  validation_manifest: splits/val.csv
  normalization_mean: [0.5, 0.5, 0.5]
  normalization_std: [0.25, 0.25, 0.25]
projection_hidden_dim: 1024
bottleneck_dim: 256
output_dim: 1024
local_crops: 2
student_temperature: 0.1
teacher_temperature_start: 0.04
teacher_temperature: 0.07
teacher_temperature_warmup_epochs: 30
teacher_momentum: 0.996
center_momentum: 0.9
freeze_last_layer_epochs: 1
training:
  batch_size: 64
  num_workers: 8
  epochs: 200
  warmup_epochs: 10
  learning_rate: 0.0005
  minimum_learning_rate: 0.000001
  weight_decay: 0.04
  gradient_clip_norm: 1.0
  mixed_precision: true
