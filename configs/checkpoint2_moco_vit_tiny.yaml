run_name: moco_vit_tiny_seed0
method: moco
backbone: vit_tiny
seed: 0
output_root: results/checkpoint2/pretraining
checkpoint_root: artifacts/checkpoints/checkpoint2/pretraining
image_size: 224
data:
  train_root: data/train
  train_manifest: splits/train.csv
  validation_manifest: splits/val.csv
  normalization_mean: [0.5, 0.5, 0.5]
  normalization_std: [0.25, 0.25, 0.25]
projection_dim: 128
projection_hidden_dim: 1024
queue_size: 4096
momentum: 0.999
temperature: 0.2
training:
  batch_size: 128
  num_workers: 8
  epochs: 200
  warmup_epochs: 10
  learning_rate: 0.0005
  minimum_learning_rate: 0.000001
  weight_decay: 0.05
  gradient_clip_norm: 1.0
  mixed_precision: true

